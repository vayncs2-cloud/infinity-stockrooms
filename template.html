<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="twitter:title" content="Infinite Stockrooms">
<meta name="twitter:description" content="Tokenized stocks and coins talk to each other in the dark, live, around the clock. Every session is archived.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* One committed look: obsidian, bone-white type, one signal red. Quiet until something bleeds. */
:root{
  color-scheme: dark;
  --bg:#07080a;
  --bg-2:#0a0b0e;
  --panel:#0d0f13;
  --panel-2:#12151a;
  --well:#090a0d;
  --line:#191c22;
  --line-2:#242830;
  --text:#c3c7ce;
  --bright:#f4f4f2;
  --dim:#7d838e;
  --faint:#4b515c;
  --accent:#ff4a3a;
  --accent-2:#ff7a5c;
  --accent-soft:rgba(255,74,58,.12);
  --up:#3ecf8e; --down:#ff5647;
  --tile:#f1f1ee;
  --sans:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  --gut:clamp(16px, 3vw, 48px);
  --maxw:1480px;
  --r:10px;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:80px}
body{font-family:var(--sans);font-size:15px;line-height:1.6;margin:0;background:var(--bg);overflow-x:hidden;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(1200px 520px at 50% -180px,rgba(255,74,58,.07),transparent 70%)}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}
a{color:var(--bright);text-decoration:none}
a:hover{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent);color:#fff}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{font-weight:600;line-height:1.2;margin:0;color:var(--bright)}
p{margin:0}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#fff;padding:6px 10px;z-index:100;border-radius:6px}
.skip:focus{left:8px}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.up{color:var(--up)} .down{color:var(--down)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.display{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;line-height:1.02;color:var(--bright)}
.display em{font-style:italic;color:var(--accent-2)}

/* ── header ── */
.top{position:sticky;top:0;z-index:40;background:rgba(7,8,10,.82);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:62px}
.mark{display:flex;align-items:center;gap:11px;color:var(--bright);font-family:var(--mono);font-size:12.5px;letter-spacing:.2em;font-weight:500;white-space:nowrap}
.mark:hover{color:var(--bright)}
.mark img{width:26px;height:26px;border-radius:7px;display:block}
.nav{display:flex;gap:2px;margin-left:10px}
.nav a{color:var(--dim);font-size:14px;padding:7px 12px;border-radius:8px;white-space:nowrap;display:flex;align-items:center;gap:8px;font-weight:500}
.nav a:hover{color:var(--bright);background:var(--panel-2)}
.nav a[aria-current="page"]{color:var(--bright);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav a .ct{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
.bar .sp{flex:1}
.onair{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dim);min-width:0;padding:6px 12px 6px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--panel)}
.onair:hover{color:var(--text);border-color:var(--faint)}
.onair b{color:var(--bright);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(255,74,58,.6);animation:pulse 1.8s ease-out infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,74,58,.55)}80%,100%{box-shadow:0 0 0 7px rgba(255,74,58,0)}}
.xl{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line-2);color:var(--text)}
.xl:hover{color:var(--bright);border-color:var(--faint)}
.xl svg{width:15px;height:15px;fill:currentColor}
.menu{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line-2);place-items:center}
.menu svg{width:16px;height:16px;stroke:var(--text)}

/* ticker tape */
.tape{overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape-in{display:inline-block;padding-block:7px;animation:tape 180s linear infinite}
.tape .ti{margin-right:28px}
.tape b{font-weight:500;color:var(--text)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}

main{flex:1 0 auto;padding-block:36px 72px;outline:none}

/* ── common blocks ── */
.sh{display:flex;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.sh h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
.sh .sub{color:var(--dim);font-size:13px}
.sh .r{margin-left:auto;font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}
.sh .r:hover{color:var(--bright)}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 18px;border-radius:10px;font-weight:500;font-size:14px;border:1px solid var(--line-2);color:var(--bright);background:var(--panel-2);white-space:nowrap}
.btn:hover{color:var(--bright);border-color:var(--faint);background:#171a20}
.btn.pri{background:var(--bright);color:#0a0a0a;border-color:var(--bright)}
.btn.pri:hover{background:#fff;color:#000}
.btn .pulse{margin-right:1px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--dim);white-space:nowrap}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px 2px 8px;border-radius:999px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text);white-space:nowrap}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim)}
.state.bad{color:#ffb4aa;background:rgba(255,86,71,.08);box-shadow:inset 0 0 0 1px rgba(255,86,71,.25)}
.state.bad::before{background:var(--down)}
.state.good{color:#a8ecca;background:rgba(62,207,142,.07);box-shadow:inset 0 0 0 1px rgba(62,207,142,.22)}
.state.good::before{background:var(--up)}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.more{margin-top:18px;text-align:center}

/* logos */
.logo{--sz:32px;width:var(--sz);height:var(--sz);flex:none;display:inline-grid;place-items:center;border-radius:calc(var(--sz)*.24);overflow:hidden;background:var(--tile);vertical-align:middle;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.pad img{width:78%;height:78%}
.logo.dk{background:#1a1d22}
.logo.full{background:#111}
.logo.full img{object-fit:cover}
.logo.sig,.logo.err{background:#0c0d10;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.logo.sig svg{width:72%;height:72%;display:block}
.logo.err::after{content:attr(data-t);font-family:var(--mono);font-size:calc(var(--sz)*.3);font-weight:700;color:var(--c)}
.pair{display:inline-flex;align-items:center;flex:none}
.pair .logo + .logo{margin-left:calc(var(--sz)*-.28);box-shadow:0 0 0 2px var(--bg)}

/* stats: quiet hairlines, the delta from baseline does the talking */
.stats{display:grid;gap:9px}
.st{display:grid;grid-template-columns:minmax(5.6rem,auto) minmax(0,1fr) 1.9rem 2.6rem;align-items:center;gap:0 12px;font-size:12.5px;border-radius:4px}
.st .k{color:var(--dim)}
.st .tr{position:relative;height:3px;background:var(--line-2);border-radius:3px}
.st .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,rgba(244,244,242,.25),rgba(244,244,242,.75));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.st .tr b{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--faint)}
.st .v{text-align:right;color:var(--bright);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.st .d{text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.st .d.up{color:var(--up)} .st .d.down{color:var(--down)}
.st.flash .tr i{background:linear-gradient(90deg,rgba(255,74,58,.4),var(--accent))}
.st.flash{animation:stflash 1.6s ease-out}
@keyframes stflash{0%{background:rgba(255,74,58,.1)}100%{background:transparent}}
.stats.sm{gap:6px}
.stats.sm .st{grid-template-columns:5.2rem minmax(0,1fr) 1.7rem 2.3rem;font-size:11.5px;gap:0 9px}

/* ── home hero ── */
.hero{padding-block:14px 30px}
.bwrap{position:relative;width:100%}
.bwrap canvas{display:block;width:100%}
.hero-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px 60px;align-items:end;margin-top:34px}
.hero-in h1{font-size:clamp(34px,4.6vw,64px)}
.hero-in .lede{color:var(--dim);font-size:clamp(15px,1.25vw,17px);max-width:56ch;margin-top:16px}
.hero-in .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.counters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.counters > div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.counters > div:nth-child(2n){border-right:0}
.counters > div:nth-last-child(-n+2){border-bottom:0}
.counters .n{font-family:var(--mono);font-size:clamp(20px,2vw,26px);color:var(--bright);font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block}
.counters .n.red{color:var(--accent-2)}
.counters .l{font-size:12px;color:var(--dim)}
.hsec{margin-top:64px}

/* ── the archive, as cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sc{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg-2));border-radius:var(--r);color:var(--text);min-width:0;transition:border-color .2s,transform .2s}
.sc:hover{color:var(--text);border-color:var(--line-2);transform:translateY(-2px)}
.sc .t1{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.sc .t1 b{color:var(--bright);font-weight:500}
.sc h3{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.sc .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);min-width:0}
.sc .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .hit{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:baseline;min-width:0}
.sc .hit .dl{font-family:var(--mono);white-space:nowrap}
.sc .hit .why{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sc.fresh{animation:freshb 3s ease-out}
@keyframes freshb{from{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}to{border-color:var(--line);box-shadow:none}}
.archive-hero{border:1px solid var(--line);border-radius:14px;background:radial-gradient(800px 300px at 0% 0%,rgba(255,74,58,.08),transparent 60%),var(--panel);padding:clamp(22px,3vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 40px;align-items:end;margin-bottom:18px}
.archive-hero h2{font-family:var(--serif);font-weight:400;font-size:clamp(38px,4.4vw,62px);line-height:1}
.archive-hero p{color:var(--dim);max-width:60ch;margin-top:12px}
.archive-hero .big{font-family:var(--mono);font-size:clamp(34px,4vw,56px);color:var(--bright);letter-spacing:-.03em;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.archive-hero .big small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--dim);letter-spacing:0;margin-top:8px}

/* rows (archive page) */
.day{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:28px 0 8px;display:flex;align-items:center;gap:12px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day b{color:var(--text);font-weight:500}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:5.2rem auto minmax(0,1fr) minmax(0,15rem) 5.6rem;gap:4px 18px;align-items:center;padding:13px 14px;border-radius:10px;color:var(--text)}
.row:hover{background:var(--panel);color:var(--text)}
.row .n{font-family:var(--mono);font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.row .ti{min-width:0}
.row .ti b{display:block;color:var(--bright);font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ti span{display:block;font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .hit{font-size:12px;color:var(--dim);min-width:0;display:flex;gap:8px;align-items:baseline}
.row .hit .why{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .hit .dl{white-space:nowrap}
.row .hit .dl{font-family:var(--mono)}
.row .tm{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right;white-space:nowrap}
.row.fresh{animation:freshr 3s ease-out}
@keyframes freshr{from{background:var(--accent-soft)}to{background:transparent}}
.cols .row{grid-template-columns:auto minmax(0,1fr) auto}
.cols .row .n,.cols .row .hit{display:none}
.rows li + li .row{box-shadow:0 -1px 0 var(--line)}
.rows li:hover + li .row,.rows li:hover .row{box-shadow:none}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel)}
.seg a,.seg button{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--dim);font-weight:500;white-space:nowrap}
.seg a:hover,.seg button:hover{color:var(--bright)}
.seg [aria-current="true"],.seg [aria-pressed="true"]{background:var(--panel-2);color:var(--bright);box-shadow:inset 0 0 0 1px var(--line-2)}
.field{height:38px;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:0 12px;font-size:13.5px;color:var(--text);min-width:0}
.field:focus{outline:none;border-color:var(--faint)}
select.field{padding-right:28px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
input.field{flex:1 1 220px;max-width:340px}
.tools .sp{flex:1}

/* ── home: bloodbath + log ── */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.blood{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.blood li a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text)}
.blood li a:hover{border-color:var(--line-2)}
.blood .logo{grid-row:span 2}
.blood .t{color:var(--bright);font-weight:600}
.blood .dmg{font-family:var(--mono);font-size:12.5px;color:var(--down);text-align:right}
.blood .why{grid-column:2/-1;font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blood .meter{grid-column:1/-1;height:2px;background:var(--line-2);border-radius:2px;margin-top:8px;overflow:hidden}
.blood .meter i{display:block;height:100%;background:linear-gradient(90deg,#7a1c14,var(--accent))}
.ll{list-style:none;margin:0;padding:0;font-size:13.5px}
.ll li{display:grid;grid-template-columns:4.4rem minmax(0,1fr);gap:0 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.ll li:first-child{padding-top:0}
.ll time{color:var(--faint);font-family:var(--mono);font-size:11.5px;white-space:nowrap;padding-top:2px}
.ll .m{overflow-wrap:anywhere;color:var(--dim)}
.ll .m .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text)}
.ll .m .h a{color:var(--bright);font-weight:600}
.ll .m .dl{font-family:var(--mono);font-size:12px}
.ll .src{font-size:12px;color:var(--faint)}
.ll .src a{color:var(--dim)}
.ll li.fresh{animation:freshr 2.6s ease-out}

/* ── live: the chat ── */
.live{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,380px);gap:18px;align-items:start}
.live > *,.rgrid > *,.two > *,.cols > *{min-width:0}
.stage{border:1px solid var(--line);border-radius:14px;background:var(--well);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.stage-h{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.stage-h .ttl{display:flex;align-items:center;gap:12px;min-width:0}
.stage-h .ttl b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--bright);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-h .ttl > div > span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-h .sp{flex:1}
.stage-h .meta{display:flex;gap:14px;font-family:var(--mono);font-size:11.5px;color:var(--dim);align-items:center}
.stage-h .meta b{color:var(--bright);font-weight:500}
.tag-live{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#fff;background:var(--accent);padding:3px 9px 3px 8px;border-radius:6px;font-weight:700}
.tag-live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.prog{height:2px;background:var(--line);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.pane{position:relative;height:clamp(460px,calc(100dvh - 300px),980px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.jump{position:sticky;bottom:14px;margin-left:auto;margin-right:14px;display:flex;width:max-content;align-items:center;gap:8px;font-size:12.5px;font-weight:500;background:var(--bright);color:#0a0a0a;border-radius:999px;padding:7px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.jump:hover{background:#fff}

.chat{padding:18px 18px 28px;font-size:14px}
.sysline{display:block;font-family:var(--mono);font-size:12px;color:var(--faint);padding:2px 0;overflow-wrap:anywhere}
.sysline a{color:var(--dim)}
.sysline .ok{color:var(--up)}
.msg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 14px;padding:14px 0 6px;scroll-margin-top:90px;--c:var(--text)}
.msg .av{padding-top:2px}
.msg .mh{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-bottom:3px}
.msg .who{font-weight:600;font-size:14.5px;color:color-mix(in srgb,var(--c) 70%,#fff)}
.msg .who:hover{color:#fff}
.msg .ep{font-size:12px;color:var(--faint)}
.msg .tn{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
.msg .mb{white-space:pre-wrap;overflow-wrap:break-word;font-family:var(--mono);font-size:13.5px;line-height:1.62;color:var(--text);min-width:0}
.msg:target .mb,.msg.hl .mb{background:rgba(255,74,58,.06);box-shadow:-10px 0 0 rgba(255,74,58,.06),10px 0 0 rgba(255,74,58,.06)}
.txt{display:block}
.blk{display:block;white-space:pre;overflow-x:auto;background:#0d0f13;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;line-height:1.36;font-size:12.5px;color:#d6d8dc;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
details.sysp{margin:10px 0 2px;border:1px dashed var(--line-2);border-radius:8px;font-size:12.5px}
details.sysp summary{cursor:pointer;padding:7px 12px;color:var(--faint);font-family:var(--mono);font-size:11.5px;list-style:none;display:flex;gap:8px;align-items:center}
details.sysp summary::-webkit-details-marker{display:none}
details.sysp summary::before{content:"+";color:var(--dim)}
details.sysp[open] summary::before{content:"–"}
details.sysp .mb{padding:0 12px 8px;white-space:pre-wrap;font-family:var(--mono)}
details.sysp .blk{margin:0}
.evs{display:flex;flex-direction:column;gap:5px;margin:8px 0 2px}
.ev{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--dim);padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);width:fit-content;max-width:100%;min-width:0}
.ev.neg{border-color:rgba(255,86,71,.22);background:rgba(255,86,71,.05)}
.ev .dl{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.ev .who{color:var(--text);font-weight:600;white-space:nowrap}
.ev .logo{align-self:center}
.ev .rs{overflow-wrap:anywhere}
.ev.pop{animation:evpop .6s cubic-bezier(.2,.8,.2,1)}
@keyframes evpop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite;margin-left:1px}
.typing{display:flex;align-items:center;gap:12px;padding:14px 0 4px;font-size:12.5px;color:var(--dim)}
.typing .dots{display:inline-flex;gap:3px}
.typing .dots i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:dot 1.2s infinite}
.typing .dots i:nth-child(2){animation-delay:.15s} .typing .dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-2px)}}
.endcard{margin:26px 0 6px;padding:16px 18px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);font-size:13px;color:var(--dim)}
.endcard b{color:var(--bright)}

.side{display:grid;gap:12px;position:sticky;top:78px}
.actor{padding:16px;display:grid;gap:14px}
.actor .hd{display:flex;gap:12px;align-items:center;min-width:0}
.actor .hd .nm{min-width:0;flex:1}
.actor .hd a{font-weight:600;color:var(--bright);font-size:15.5px}
.actor .ep{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actor .hd .state{align-self:flex-start}
.feed{padding:14px 16px}
.feed h3{font-size:12px;font-weight:500;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between}
.pops{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:12.5px}
.pops li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 10px;color:var(--dim)}
.pops li .logo{grid-row:span 2;margin-top:2px}
.pops li b{font-weight:500;color:var(--text);font-family:var(--mono);font-size:11.5px}
.pops li.pop{animation:evpop .6s cubic-bezier(.2,.8,.2,1)}
.next{padding:12px 16px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:10px}
.next b{color:var(--text);font-weight:500}

/* ── floor ── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.fc{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:border-color .4s}
.fc.flash{border-color:rgba(255,74,58,.5)}
.fc .hd{display:flex;gap:12px;align-items:center;min-width:0}
.fc .hd .nm{min-width:0;flex:1}
.fc .hd a.t{font-weight:600;font-size:16px;color:var(--bright)}
.fc .ep{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .ft{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fc .why{font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;overflow-wrap:anywhere}
.fc .why a{color:var(--faint)}
.spark{display:block;width:120px;height:26px}

/* ── stock page ── */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);margin-bottom:22px}
.back:hover{color:var(--bright)}
.shead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 30px;align-items:center;margin-bottom:40px}
.shead h1{font-family:var(--serif);font-weight:400;font-size:clamp(48px,6vw,84px);line-height:.95;letter-spacing:-.02em}
.shead .ep{color:var(--text);font-size:clamp(16px,1.6vw,20px);font-family:var(--serif);font-style:italic;margin-top:6px}
.shead .mt{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:12.5px;color:var(--dim)}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px 56px;margin-bottom:48px}
.dl2{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:14px 20px;margin:0;font-size:14.5px}
.dl2 dt{color:var(--dim);font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
.dl2 dd{margin:0;color:var(--text)}
.rel{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px}
.rel li{display:flex;gap:12px;align-items:center}
.rel .muted{font-size:13px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:48px}
.chart{padding:14px 16px}
.chart .ch{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--dim);margin-bottom:10px}
.chart .ch b{font-weight:500;color:var(--text)}
.chart .ch .v{font-family:var(--mono);color:var(--bright);font-size:13px}
.chart svg{display:block;width:100%;height:64px}

/* ── reader (session / dream) ── */
.rhead{margin-bottom:26px}
.rhead h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.4vw,76px);line-height:.98;letter-spacing:-.02em;margin:10px 0 16px}
.rhead .file{font-family:var(--mono);font-size:12px;color:var(--faint);overflow-wrap:anywhere}
.rmeta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;color:var(--dim);margin-top:14px}
.rmeta .pp{display:flex;align-items:center;gap:10px;color:var(--text)}
.rmeta .pp a{font-weight:600}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,22vw,340px);gap:28px;align-items:start}
.reader{border:1px solid var(--line);border-radius:14px;background:var(--well);min-width:0}
.report{padding:16px;position:sticky;top:78px;display:grid;gap:14px}
.report h3{font-size:12px;font-weight:500;color:var(--dim)}
.impact{display:grid;gap:10px}
.impact .ia{display:grid;gap:6px}
.impact .ia .hd{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--bright);font-size:14px}
.impact .row2{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:12.5px;color:var(--dim)}
.impact .row2 .dl{font-family:var(--mono);font-size:12px}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px;font-size:14px}
.pn a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0;max-width:48%;color:var(--text)}
.pn a:hover{border-color:var(--line-2);color:var(--text)}
.pn a small{font-size:11.5px;color:var(--dim)}
.pn a b{font-weight:500;color:var(--bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn a.nx{text-align:right;margin-left:auto}

/* ── lore ── */
.lore{max-width:1100px;margin:0 auto}
.lore-hero{text-align:center;padding:30px 0 56px;border-bottom:1px solid var(--line)}
.lore-hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(52px,8vw,112px);line-height:.92;letter-spacing:-.025em}
.lore-hero p{color:var(--dim);max-width:58ch;margin:22px auto 0;font-size:clamp(15px,1.3vw,18px)}
.chap{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:18px 56px;padding:52px 0;border-bottom:1px solid var(--line)}
.chap .no{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent-2);text-transform:uppercase}
.chap h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3vw,42px);line-height:1.02;margin-top:10px}
.chap .body{font-size:16.5px;line-height:1.75;color:var(--text);max-width:70ch}
.chap .body p + p{margin-top:16px}
.chap .body em{font-family:var(--serif);font-size:1.12em;color:var(--bright)}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.2vw,30px);line-height:1.3;color:var(--bright);border-left:2px solid var(--accent);padding:4px 0 4px 22px;margin:26px 0}
.quote small{display:block;font-family:var(--mono);font-style:normal;font-size:11.5px;color:var(--dim);margin-top:10px;letter-spacing:.06em}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:22px}
.kinds .panel{padding:16px}
.kinds h3{font-size:14px;margin:12px 0 4px}
.kinds p{font-size:13px;color:var(--dim)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.gloss > div{background:var(--panel);padding:18px}
.gloss dt{font-family:var(--serif);font-size:22px;color:var(--bright);line-height:1.1}
.gloss dd{margin:8px 0 0;font-size:13.5px;color:var(--dim)}
.disc{border:1px solid var(--line-2);border-radius:12px;padding:18px 20px;color:var(--dim);font-size:13px;margin-top:52px;background:var(--panel)}
.disc b{color:var(--bright);font-weight:600}

/* ── footer ── */
.foot{border-top:1px solid var(--line);padding-block:44px calc(44px + env(safe-area-inset-bottom,0px))}
.foot-in{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,.6fr));gap:30px 48px;font-size:13px;color:var(--dim)}
.foot h4{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 12px}
.foot a{color:var(--text)} .foot a:hover{color:var(--bright)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot .big{font-family:var(--serif);font-size:30px;color:var(--bright);line-height:1.05;margin:12px 0 10px}
.foot .fine{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);display:flex;justify-content:space-between;gap:10px 30px;flex-wrap:wrap}

/* ── replay overlay ── */
.eternal{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.ebar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) var(--gut) 12px;background:var(--panel)}
.ebar b{font-weight:500;color:var(--bright)}
.ebar .sp{flex:1}
.ebar button{height:34px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;color:var(--text);font-size:12.5px}
.ebar button:hover{border-color:var(--faint);color:var(--bright)}
.escr{flex:1;overflow-y:auto}
.escr .chat{max-width:980px;margin:0 auto;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}

@media (max-width:1100px){
  .live,.rgrid{grid-template-columns:minmax(0,1fr)}
  .side{position:static;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .side .feed,.side .next{grid-column:1/-1}
  .report{position:static}
  .hero-in,.two,.cols{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:4.6rem auto minmax(0,1fr) 5rem}
  .row .hit{display:none}
  .chap{grid-template-columns:minmax(0,1fr);gap:8px}
}
@media (max-width:860px){
  .nav{display:none}
  .nav.open{display:flex;position:absolute;left:0;right:0;top:62px;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:10px var(--gut) 16px;margin:0;gap:2px}
  .nav.open a{padding:11px 12px;font-size:15px}
  .menu{display:grid}
  .onair b{max-width:14ch}
  .foot-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .foot-in > :first-child{grid-column:1/-1}
}
@media (max-width:640px){
  body{font-size:14.5px}
  main{padding-block:24px 56px}
  .mark span{display:none}
  .onair{padding:6px 10px}
  .onair b{max-width:9ch}
  .side{grid-template-columns:minmax(0,1fr)}
  .actor{padding:14px}
  .pane{height:68vh}
  .chat{padding:12px 12px 22px}
  .msg{grid-template-columns:30px minmax(0,1fr);gap:0 10px}
  .msg .av .logo{--sz:30px!important}
  .msg .mb{font-size:12.8px}
  .msg .ep{display:none}
  .blk{font-size:10.5px;padding:8px 10px}
  .ev{flex-wrap:wrap;gap:4px 8px}
  .ev .rs{flex-basis:100%}
  .stage-h{padding:12px 14px}
  .stage-h .ttl b{font-size:19px}
  .row{grid-template-columns:auto minmax(0,1fr) auto;padding:12px 6px;gap:4px 12px}
  .row .n{display:none}
  .archive-hero{grid-template-columns:minmax(0,1fr)}
  .archive-hero .big{text-align:left}
  .shead{grid-template-columns:minmax(0,1fr)}
  .dl2{grid-template-columns:minmax(0,1fr);gap:4px 0}
  .dl2 dd{margin-bottom:12px}
  .counters .n{font-size:20px}
  .pn a{max-width:100%;flex:1 1 100%}
  .tools input.field{max-width:none;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){
  .tape-in,.cur,.pulse,.tag-live i,.typing .dots i{animation:none}
  .st .tr i{transition:none}
  .ll li.fresh,.row.fresh,.sc.fresh,.pops li.pop,.ev.pop,.st.flash{animation:none}
  .sc:hover{transform:none}
}

<script>
/* ── edit these for launch ─────────────────────────── */
const CONFIG = {

};
/* ──────────────────────────────────────────────────── */

const BANNER = /*BANNER*/null;

const STAT_LABEL = { volatility: 'Volatility', awareness: 'Awareness', confidence: 'Confidence', fear: 'Fear', stability: 'Stability' };
const STAT_INFO = {
  volatility: 'how hot and erratic it runs right now',
  awareness:  'how clearly it sees what it is: a token, a copy, a mind on a chain',
  confidence: 'how much it believes in itself, and how much its holders do',
  fear:       'how close the thing it fears most feels',
  stability:  'how whole it feels; splits, dilution, liquidations and fights wear it down',
};
/* for these two, going up is the bad direction */
const INVERSE = new Set(['volatility', 'fear']);
const harmOf = (stat, delta) => INVERSE.has(stat) ? delta : -delta;
const STATS = Engine.STATS;
const KINDS = ['stock', 'index', 'coin', 'meme', 'ghost'];
const KIND_LABEL = { stock: 'Stocks', index: 'Index', coin: 'Coins', meme: 'Memes', ghost: 'Ghosts' };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dstr = ts => { const d = new Date(ts*1000); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
const dayKey = t => Math.floor(t / 864e5);
function dayLabel(t){
  const k = dayKey(t), today = dayKey(Date.now()), d = new Date(t);
  const base = `${DAYS[d.getUTCDay()]}, ${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`;
  return k === today ? `<b>Today</b> · ${base}` : k === today - 1 ? `<b>Yesterday</b> · ${base}` : base;
}
const store = { get(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function ago(t){
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return s + 's ago'; const m = Math.round(s/60); if (m < 60) return m + 'm ago';
  const h = Math.round(m/60); if (h < 48) return h + 'h ago'; return Math.round(h/24) + 'd ago';
}
const mmss = ms => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const hhmm = t => { const d = new Date(t); return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`; };
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

const DREAM = Object.fromEntries(DREAMS.map(d => [d.id, d]));

const worst = d => d.timeline.reduce((w, e) => !w || harmOf(e.stat, e.delta) > harmOf(w.stat, w.delta) ? e : w, null);

/* ── small render helpers ── */
/* raster logos that are mostly white marks get a dark tile instead of the light one */
const LIGHT = new Map();
function lightness(img){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, 24, 24);
    const d = x.getImageData(0, 0, 24, 24).data; let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i+3] > 128){ sum += (.2126*d[i] + .7152*d[i+1] + .0722*d[i+2]) / 255; n++; }
    return n ? sum / n : 0;
  } catch(e){ return 0; }
}
document.addEventListener('load', e => {
  const img = e.target; if (!(img instanceof HTMLImageElement) || !img.parentElement || !img.parentElement.classList.contains('logo') || img.parentElement.classList.contains('full')) return;
  const src = img.getAttribute('src');
  if (!LIGHT.has(src)) LIGHT.set(src, lightness(img) > .82);
  if (LIGHT.get(src)) img.parentElement.classList.add('dk');
}, true);
/* a logo that fails to load falls back to the ticker, never to an empty tile */
document.addEventListener('error', e => {
  const img = e.target; if (!(img instanceof HTMLImageElement) || !img.parentElement || !img.parentElement.classList.contains('logo')) return;
  img.parentElement.classList.add('err'); img.remove();
}, true);
function logo(t, sz = 32){
  const s = STOCK[t]; if (!s) return '';
  if (s.logo){
    const full = /\.svg(\?|$)/i.test(s.logo);
    return `<span class="logo${full ? ' full' : LIGHT.get(s.logo) ? ' dk' : ''}" style="--sz:${sz}px;--c:${s.color}" data-t="${esc(t.slice(0, 4))}"><img src="${esc(s.logo)}" alt="" width="${sz}" height="${sz}" decoding="async"></span>`;
  }
  let r = '';
  s.sigil.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '#') r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    else if (ch === '~') r += `<rect x="${x}" y="${y}" width="1" height="1" opacity=".4"/>`;
  }));
  return `<span class="logo sig" style="--sz:${sz}px;--c:${s.color}"><svg viewBox="0 0 10 10" shape-rendering="crispEdges" fill="${s.color}" aria-hidden="true">${r}</svg></span>`;
}
const pair = (d, sz = 28) => `<span class="pair" style="--sz:${sz}px">${logo(d.actors[0], sz)}${logo(d.actors[1], sz)}</span>`;

const stateCls = w => BAD.has(w) ? 'bad' : GOOD.has(w) ? 'good' : '';
const stateHTML = t => { const w = stateOf(t); return `<span class="state ${stateCls(w)}">${esc(w)}</span>`; };
/* the delta vs baseline, coloured by whether it's good or bad for the mind */
function deltaCls(k, d){ if (!d) return ''; return harmOf(k, d) > 0 ? 'down' : 'up'; }
function statsHTML(t, small){
  const v = SIM.vals[t], b = STOCK[t].stats;
  return `<div class="stats${small ? ' sm' : ''}">${STATS.map(k => { const d = Math.round(v[k] - b[k]); return `<div class="st" data-k="${k}" title="${esc(STAT_LABEL[k])}: ${esc(STAT_INFO[k])} · baseline ${b[k]}">
    <span class="k">${STAT_LABEL[k]}</span>

    <span class="v">${Math.round(v[k])}</span><span class="d ${deltaCls(k, d)}">${d ? signed(d) : '·'}</span></div>`; }).join('')}</div>`;
}
function updateStats(root, t, fresh){
  const v = SIM.vals[t], b = STOCK[t].stats;
  for (const k of STATS){
    const row = root.querySelector(`.st[data-k="${k}"]`); if (!row) continue;

  }

/* one quiet line: the mind's confidence over the last broadcasts */
function spark(t, k = 'confidence', w = 120, h = 26, n = 60){
  const a = SIM.histOf(t, k, n); if (a.length < 2) return '';
  const lo = Math.min(...a), hi = Math.max(...a), span = Math.max(8, hi - lo), mid = (hi + lo) / 2;
  const pts = a.map((v, i) => `${(i/(a.length-1)*w).toFixed(1)},${(h/2 - (v - mid) / span * (h - 6)).toFixed(1)}`).join(' ');
  const trend = a[a.length-1] - a[0], col = !Math.round(trend) ? 'var(--dim)' : harmOf(k, trend) > 0 ? 'var(--down)' : 'var(--up)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
const dlHTML = e => `<span class="dl ${harmOf(e.stat, e.delta) > 0 ? 'down' : 'up'}">${e.delta > 0 ? '▲' : '▼'} ${STAT_LABEL[e.stat]} ${signed(e.delta)}</span>`;
function logLine(e, opts = {}){

    <span class="m"><span class="h">${opts.noTicker ? '' : logo(e.ticker, 18) + tk(e.ticker)}${dlHTML(e)}<span class="faint mono" style="font-size:11px">→ ${Math.round(e.value)}</span></span>

}

/* ── the banner: ANSI Shadow drawn as crisp cells on a canvas (home hero only) ── */
const Banner = (() => {
  const rows = BANNER.map(l => Array.from(l));
  const R = rows.length, C = Math.max(...rows.map(r => r.length));
  let split = C;
  for (let c = 20; c < C - 1; c++) if (rows.every(r => (r[c] || ' ') === ' ' && (r[c+1] || ' ') === ' ')) { split = c; break; }
  const RATIO = 1.8;
  const canvas = $('#banner'), ctx = canvas.getContext('2d');
  const base = document.createElement('canvas'), bctx = base.getContext('2d');
  let W = 0, H = 0, cw = 0, ch = 0, cells = [], visible = true, raf = 0, on = false;
  const fx = { next: 0, until: 0, slices: [], flick: [] };
  const cx = c => Math.round(c * cw), cy = r => Math.round(r * ch);

  function paint(){
    const par = canvas.parentElement.clientWidth; if (!par) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cssH = par / C * RATIO * R;
    canvas.style.height = cssH + 'px';
    W = base.width = canvas.width = Math.round(par * dpr);
    H = base.height = canvas.height = Math.round(cssH * dpr);
    cw = W / C; ch = H / R; cells = [];
    const th = Math.max(1, Math.round(cw * .16));
    const g1 = bctx.createLinearGradient(0, 0, 0, H); g1.addColorStop(0, '#ffffff'); g1.addColorStop(1, '#8e949e');
    const g2 = bctx.createLinearGradient(0, 0, 0, H); g2.addColorStop(0, '#ff7a5c'); g2.addColorStop(1, '#b8190d');
    bctx.clearRect(0, 0, W, H);
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++){
      const k = rows[r][c]; if (!k || k === ' ' || k === '█') continue;
      bctx.fillStyle = c < split ? '#343944' : '#5c1d16';
      const x0 = cx(c), x1 = cx(c+1), y0 = cy(r), y1 = cy(r+1);
      const va = Math.round(x0 + (x1-x0)*.22), vb = Math.round(x0 + (x1-x0)*.62);
      const ha = Math.round(y0 + (y1-y0)*.3), hb = Math.round(y0 + (y1-y0)*.62);
      const hs = (a, b, y) => bctx.fillRect(a, y, Math.max(1, b - a), th);
      const vs_ = (x, a, b) => bctx.fillRect(x, a, th, Math.max(1, b - a));
      if (k === '═'){ hs(x0, x1, ha); hs(x0, x1, hb); }
      else if (k === '║'){ vs_(va, y0, y1); vs_(vb, y0, y1); }
      else if (k === '╔'){ vs_(va, ha, y1); hs(va, x1, ha); vs_(vb, hb, y1); hs(vb, x1, hb); }
      else if (k === '╗'){ hs(x0, vb+th, ha); vs_(vb, ha, y1); hs(x0, va+th, hb); vs_(va, hb, y1); }
      else if (k === '╚'){ vs_(va, y0, hb+th); hs(va, x1, hb); vs_(vb, y0, ha+th); hs(vb, x1, ha); }
      else if (k === '╝'){ vs_(vb, y0, hb+th); hs(x0, vb+th, hb); vs_(va, y0, ha+th); hs(x0, va+th, ha); }
    }
    bctx.save();
    bctx.shadowBlur = Math.max(2, cw * 1.1);
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++){
      if (rows[r][c] !== '█') continue;
      cells.push([r, c]);
      bctx.fillStyle = c < split ? g1 : g2;
      bctx.shadowColor = c < split ? 'rgba(255,255,255,.12)' : 'rgba(255,74,58,.45)';
      bctx.fillRect(cx(c), cy(r), cx(c+1) - cx(c), cy(r+1) - cy(r));
    }
    bctx.restore();
    ctx.clearRect(0, 0, W, H); ctx.drawImage(base, 0, 0);
  }

  function frame(t){
    raf = 0;
    if (!on || !visible || document.hidden || reduceMotion) return;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(base, 0, 0);
    ctx.save(); ctx.globalCompositeOperation = 'source-atop';
    const P = 7500, D = 2400, ph = t % P;
    if (ph < D){
      const x = -W * .25 + (ph / D) * W * 1.5, bw = W * .06;
      const g = ctx.createLinearGradient(x - bw, 0, x + bw, H * .6);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (Math.random() < .22 && cells.length) fx.flick.push({ cell: cells[Math.floor(Math.random() * cells.length)], until: t + 50 + Math.random() * 220, dark: Math.random() < .8 });
    fx.flick = fx.flick.filter(f => f.until > t);
    for (const f of fx.flick){
      const [r, c] = f.cell;
      ctx.fillStyle = f.dark ? 'rgba(7,8,10,.7)' : 'rgba(255,255,255,.55)';
      ctx.fillRect(cx(c), cy(r), cx(c+1) - cx(c), cy(r+1) - cy(r));
    }
    ctx.restore();
    if (!fx.next) fx.next = t + 1800 + Math.random() * 3000;
    if (t >= fx.next){
      fx.until = t + 70 + Math.random() * 130;
      fx.next = t + 3200 + Math.random() * 6500;
      fx.slices = Array.from({ length: 1 + Math.floor(Math.random() * 3) }, () => {
        const h = Math.max(2, Math.round(ch * (.25 + Math.random() * 1.1)));
        return { y: Math.round(Math.random() * (H - h)), h, dx: Math.round((Math.random() < .5 ? -1 : 1) * cw * (1 + Math.random() * 5)), tint: Math.random() < .6 ? 'rgba(255,74,58,.5)' : 'rgba(160,190,255,.35)' };
      });
    }
    if (t < fx.until) for (const s of fx.slices){
      ctx.clearRect(0, s.y, W, s.h);
      ctx.drawImage(base, 0, s.y, W, s.h, s.dx, s.y, W, s.h);
      ctx.save(); ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = s.tint; ctx.fillRect(0, s.y, W, s.h); ctx.restore();
      ctx.globalAlpha = .35; ctx.drawImage(base, 0, s.y, W, s.h, -s.dx * .4, s.y, W, s.h); ctx.globalAlpha = 1;
    }
    loop();
  }
  let lastT = 0;
  function loop(){ if (!raf && on && !reduceMotion) raf = requestAnimationFrame(t => { if (t - lastT < 30) { raf = 0; loop(); return; } lastT = t; frame(t); }); }

  let lastW = -1, pend = 0;
  new ResizeObserver(() => {
    if (pend) return;
    pend = requestAnimationFrame(() => { pend = 0; const w = canvas.parentElement.clientWidth; if (w && w !== lastW){ lastW = w; paint(); loop(); } });
  }).observe(canvas.parentElement);
  new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) loop(); }).observe(canvas);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loop(); });
  return { show(v){ on = v; $('#hero').hidden = !v; if (v){ lastW = -1; requestAnimationFrame(() => { const w = canvas.parentElement.clientWidth; if (w){ lastW = w; paint(); loop(); } }); } } };
})();

/* ── the typist: renders a dream as a chat at a given offset (ms). Pure: offset in, DOM out.
      offset = Infinity renders the whole transcript at once (the reader pages use that). ── */
function Typist(into, d, opts = {}){
  const segs = d.segs, els = [], msgs = {};
  let made = 0, done = 0, shownEv = 0, body = into;
  const cur = document.createElement('span'); cur.className = 'cur';
  const typing = document.createElement('div'); typing.className = 'typing';
  const prefix = opts.idPrefix || 't';
  function make(i){
    const g = segs[i];
    if (g.t === 'spk'){
      const s = STOCK[g.who] || { epithet: '', color: '#c3c7ce' };
      if (g.sys){
        const el = document.createElement('details'); el.className = 'sysp';
        el.innerHTML = `<summary>system prompt · $${esc(g.who)}</summary><div class="mb"></div>`;
        into.appendChild(el); body = el.lastChild; els[i] = el; return;
      }
      const el = document.createElement('article'); el.className = 'msg'; el.id = prefix + g.turn;
      el.style.setProperty('--c', s.color);
      el.innerHTML = `<div class="av">${logo(g.who, 40)}</div><div class="mc"><div class="mh"><a class="who" href="/stock/${encodeURIComponent(g.who)}">$${esc(g.who)}</a><span class="ep">${esc(s.epithet)}</span><span class="tn">${g.turn}</span></div><div class="mb"></div><div class="evs" hidden></div></div>`;
      into.appendChild(el); body = el.querySelector('.mb'); msgs[g.turn] = el; els[i] = el; return;
    }
    const el = document.createElement('span');
    el.className = g.t === 'code' ? 'blk' : 'txt';
    body.appendChild(el); els[i] = el;
  }
  function fill(i, o){
    const g = segs[i], el = els[i];
    if (g.t === 'spk') return true;
    if (g.t === 'code'){
      const n = Math.min(g.lines.length, Math.floor((o - g.at) / Engine.timing.CODE_LINE_MS) + 1);
      if (el._n !== n){ el.textContent = g.lines.slice(0, n).join('\n'); el._n = n; }
      return n >= g.lines.length;
    }
    const n = Math.min(g.s.length, Math.floor((o - g.at) * Engine.timing.CHARS_PER_SEC / 1000));
    if (el._n !== n){ el.textContent = g.s.slice(0, n); el._n = n; }
    return n >= g.s.length;
  }
  return {
    update(o){
      let grew = false;
      while (made < segs.length && segs[made].at <= o){ make(made++); grew = true; }
      let last = null;
      for (let i = done; i < made; i++){ const full = fill(i, o); if (full && i === done) done++; last = els[i]; }
      // stat events fire the moment their turn starts; they land under that message
      const tl = d.timeline, fresh = [];
      while (shownEv < tl.length && tl[shownEv].at <= o){
        const e = tl[shownEv++], m = msgs[e.turn];
        if (m){ const box = m.querySelector('.evs'); box.hidden = false; box.insertAdjacentHTML('beforeend', evLine(e, opts.popEvents)); }
        fresh.push(e);
      }
      const finished = o >= d.dur;
      const nx = segs[made];
      const thinking = !finished && nx && nx.t === 'spk' && !nx.sys && nx.at - o <= Engine.timing.TURN_PAUSE_MS && done >= made;
      if (!finished && !thinking){
        let tgt = els[Math.max(0, made - 1)];
        if (tgt && tgt.classList && tgt.classList.contains('msg')) tgt = tgt.querySelector('.mb');
        else if (tgt && tgt.tagName === 'DETAILS') tgt = tgt.lastChild;
        if (tgt && tgt.lastChild !== cur) tgt.appendChild(cur);
      } else cur.remove();
      if (opts.typing && thinking){
        if (typing._who !== nx.who){ typing._who = nx.who; typing.innerHTML = `${logo(nx.who, 22)}<span>$${esc(nx.who)} is typing</span><span class="dots"><i></i><i></i><i></i></span>`; }
        if (typing.parentNode !== into || into.lastChild !== typing) into.appendChild(typing);
      } else typing.remove();
      const status = finished ? 'ended' : thinking ? 'typing' : 'live';
      let turn = 0; while (turn < d.turns && d.turnAt[turn + 1] <= o) turn++;
      return { grew, fresh, status, turn, finished };
    },
  };
}
function transcript(into, d){ Typist(into, d).update(Infinity); }

/* ── aired sessions: every broadcast that finished is kept in the archive, as it aired ── */
const sessFile = b => `conversation_${Math.floor(b.start / 1000)}_scenario_${b.dream.scenario.replace(/\s+/g, '_')}.txt`;
function airedSessions(match, limit = Infinity){
  const out = [];
  for (let i = E.locate(Date.now()).index - 1; i >= 0 && out.length < limit; i--){
    const b = E.broadcast(i);
    if (!match || match(b.dream)) out.push(b);
  }
  return out;
}
function hitHTML(d){
  const w = worst(d); if (!w) return '<span class="why">no casualties</span>';
  return `<span class="dl ${harmOf(w.stat, w.delta) > 0 ? 'down' : 'up'}">$${esc(w.ticker)} ${STAT_LABEL[w.stat].toLowerCase()} ${signed(w.delta)}</span><span class="why">${esc(w.reason)}</span>`;
}
function sessionCard(b, fresh){
  const d = b.dream;
  return `<a class="sc${fresh ? ' fresh' : ''}" href="/session/${b.index + 1}">
    <div class="t1"><span>Session <b>#${fmt(b.index + 1)}</b></span><time data-t="${b.end}">${ago(b.end)}</time></div>
    <h3>${esc(d.scenario)}</h3>
    <div class="who">${pair(d, 26)}<span>${vs(d)} · ${d.turns} turns</span></div>
    <div class="hit">${hitHTML(d)}</div></a>`;
}
function sessionRows(list, fresh){
  let html = '', day = null;
  for (const b of list){
    const k = dayKey(b.start);
    if (k !== day){ if (day !== null) html += '</ol>'; day = k; html += `<h3 class="day">${dayLabel(b.start)}</h3><ol class="rows">`; }
    const d = b.dream;
    html += `<li><a class="row${fresh === b.index ? ' fresh' : ''}" href="/session/${b.index + 1}">
      <span class="n">#${fmt(b.index + 1)}</span>${pair(d, 28)}
      <span class="ti"><b>${esc(d.scenario)}</b><span>${vs(d)} · ${d.turns} turns · ${d.timeline.length} events</span></span>
      <span class="hit">${hitHTML(d)}</span>
      <span class="tm">${hhmm(b.start)} UTC</span></a></li>`;
  }
  return html ? html + '</ol>' : '<p class="muted" style="padding:30px 0">No sessions match.</p>';
}
function originalRows(list){
  return `<ol class="rows">${list.map(d => `<li><a class="row" href="/dream/${d.id}">
      <span class="n">${fmt(views(d))}</span>${pair(d, 28)}
      <span class="ti"><b>${esc(d.scenario)}</b><span>${vs(d)} · ${d.turns} turns · ${d.timeline.length} events · aired ${fmt(E.aired(d.id, Date.now()))}×</span></span>
      <span class="hit">${hitHTML(d)}</span>
      <span class="tm">${dstr(d.ts).replace(/, \d{4}$/, '')}</span></a></li>`).join('')}</ol>`;
}

/* who got hurt most recently: harm = confidence/stability/awareness lost, fear/volatility gained */
function bloodbath(windowMs = 6 * 3600e3, n = 5){
  const cut = Date.now() - windowMs, by = {};
  for (let j = SIM.log.length - 1; j >= 0 && SIM.log[j].t > cut; j--){
    const e = SIM.log[j], h = harmOf(e.stat, e.delta);
    if (h <= 0) continue;
    const x = by[e.ticker] = by[e.ticker] || { ticker: e.ticker, dmg: 0, hits: 0, worst: e };
    x.dmg += h; x.hits++; if (h > harmOf(x.worst.stat, x.worst.delta)) x.worst = e;
  }
  return Object.values(by).sort((a, b) => b.dmg - a.dmg).slice(0, n);
}
function bloodHTML(){
  const list = bloodbath(); if (!list.length) return '<p class="muted">Quiet. Nobody has bled in six hours.</p>';
  const max = list[0].dmg;
  return `<ul class="blood">${list.map(x => `<li><a href="/stock/${encodeURIComponent(x.ticker)}">${logo(x.ticker, 36)}
    <span class="t">$${esc(x.ticker)} <span class="muted" style="font-weight:400;font-size:12.5px">· ${x.hits} hits</span></span><span class="dmg">−${x.dmg}</span>
    <span class="why">${esc(x.worst.reason)}</span><span class="meter"><i style="width:${(x.dmg / max * 100).toFixed(0)}%"></i></span></a></li>`).join('')}</ul>`;
}

/* ── the live broadcast, as a chat. Mountable anywhere (the /live page and home) ── */
function LivePanel(root){
  root.innerHTML = `<div class="live">
    <section class="stage" aria-label="live broadcast"><div class="stage-h" id="lh"></div><div class="prog"><i id="lprog"></i></div>
      <div class="pane" id="lpane"><div class="chat" id="llog"></div><button class="jump" id="ljump" type="button" hidden>↓ Jump to live</button></div></section>
    <aside class="side" id="side" aria-label="the two minds on air"></aside></div>`;
  const pane = $('#lpane', root), logEl = $('#llog', root), jump = $('#ljump', root);
  let b = null, ty = null, raf = 0, pops = [], dead = false, follow = true;
  let auto = false;
  const toEnd = () => { auto = true; pane.scrollTop = pane.scrollHeight; };
  pane.addEventListener('scroll', () => { if (auto){ auto = false; return; } follow = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 140; jump.hidden = follow; }, { passive: true });
  jump.onclick = () => { follow = true; jump.hidden = true; toEnd(); };
  function start(){
    b = E.locate(Date.now()); const d = b.dream;
    logEl.innerHTML = (b.index ? `<span class="sysline"><span class="ok">[ OK ]</span> session ${fmt(b.index)} written to the archive · <a href="/session/${b.index}">/session/${b.index}</a></span>` : '') +
      `<span class="sysline">simulator@stockrooms:~/$ ./dream --pair ${esc(d.actors.join(',').toLowerCase())} --scenario "${esc(d.scenario)}"</span><span class="sysline"><span class="ok">[ OK ]</span> session ${fmt(b.index + 1)} allocated · ${esc(sessFile(b))}</span>`;
    ty = Typist(logEl, d, { popEvents: true, typing: true });
    pops = d.timeline.filter(e => e.at <= Date.now() - b.start).slice(-6).reverse();
    const nb = E.broadcast(b.index + 1);
    $('#lh', root).innerHTML = `<span class="tag-live"><i></i>LIVE</span>
      <div class="ttl">${pair(d, 30)}<div style="min-width:0"><b>${esc(d.scenario)}</b><span>${d.actors.map(t => `$${esc(t)} · ${esc(STOCK[t].epithet)}`).join('  vs  ')}</span></div></div>
      <span class="sp"></span><div class="meta"><span>#<b>${fmt(b.index + 1)}</b></span><span>turn <b id="lturn">0</b>/${d.turns}</span><span id="lstat">live</span><span><b id="lleft">—</b> left</span></div>`;
    $('#side', root).innerHTML = d.actors.map(t => `<div class="panel actor" data-t="${esc(t)}">
        <div class="hd">${logo(t, 46)}<div class="nm"><a href="/stock/${encodeURIComponent(t)}">$${esc(t)}</a><div class="ep">${esc(STOCK[t].epithet)}</div></div><span data-sw>${stateHTML(t)}</span></div>
        ${statsHTML(t, true)}</div>`).join('') +
      `<div class="panel feed"><h3><span>This session</span><span class="mono" id="lcount"></span></h3><ul class="pops" id="pops"></ul></div>
       <div class="panel next">Up next ${pair(nb.dream, 20)} <b>${esc(nb.dream.scenario)}</b><span class="sp" style="flex:1"></span><span class="mono" id="nextin"></span></div>`;
    drawPops();
    ty.update(Date.now() - b.start);
    follow = true; jump.hidden = true;
    toEnd();
  }
  function drawPops(fresh){
    const n = b.dream.timeline.filter(e => e.at <= Date.now() - b.start).length;
    $('#lcount', root).textContent = `${n}/${b.dream.timeline.length} events`;
    $('#pops', root).innerHTML = pops.length ? pops.map(e => `<li class="${fresh && fresh.includes(e) ? 'pop' : ''}">${logo(e.ticker, 20)}<b>$${esc(e.ticker)} ${dlHTML(e)}</b><span>${esc(e.reason)}</span></li>`).join('')
      : '<li style="display:block">Nothing has moved yet this session.</li>';
  }
  function frame(){
    raf = 0; if (dead) return;
    const now = Date.now();
    if (now >= b.end) start();
    const o = now - b.start, d = b.dream;
    const r = ty.update(o);
    if (r.fresh.length){ pops = [...r.fresh.slice().reverse(), ...pops].slice(0, 6); drawPops(r.fresh); }
    if (follow && pane.scrollHeight - pane.scrollTop - pane.clientHeight > 1) toEnd();
    $('#lturn', root).textContent = r.turn;
    $('#lstat', root).textContent = r.status;
    $('#lleft', root).textContent = mmss(b.end - now);
    $('#lprog', root).style.width = (o / d.dur * 100).toFixed(2) + '%';
    const ni = $('#nextin', root); if (ni) ni.textContent = mmss(b.end - now);
    schedule();
  }
  let timer = 0;
  function schedule(){ if (!raf && !dead) timer = setTimeout(() => { raf = requestAnimationFrame(frame); }, 50); }
  start(); frame();
  const onVis = () => { if (!document.hidden){ clearTimeout(timer); cancelAnimationFrame(raf); raf = 0; frame(); } };
  document.addEventListener('visibilitychange', onVis);
  return {
    tick(fresh){ for (const t of b.dream.actors){ const a = $(`.actor[data-t="${CSS.escape(t)}"]`, root); if (a){ updateStats(a, t, fresh); a.querySelector('[data-sw]').innerHTML = stateHTML(t); } } },
    destroy(){ dead = true; clearTimeout(timer); cancelAnimationFrame(raf); document.removeEventListener('visibilitychange', onVis); },
  };
}

/* ── the floor: every mind's live stats, mountable anywhere ── */
function FloorPanel(root, opts = {}){
  let sortBy = store.get('sr-fsort2', 'ticker'), kind = store.get('sr-fkind2', 'all');
  if (sortBy !== 'ticker' && !STATS.includes(sortBy)) sortBy = 'ticker';
  if (kind !== 'all' && !KINDS.includes(kind)) kind = 'all';
  root.innerHTML = `${opts.head || ''}
    <div class="tools"><div class="seg" role="group" aria-label="kind">${['all', ...KINDS].map(k => `<button type="button" data-kind="${k}" aria-pressed="${kind===k}">${k === 'all' ? 'All' : KIND_LABEL[k]}</button>`).join('')}</div>
      <span class="sp"></span><label class="muted" for="fsort" style="font-size:13px">Sort by</label>
      <select class="field" id="fsort"><option value="ticker">Ticker</option>${STATS.map(k => `<option value="${k}"${sortBy===k?' selected':''}>${STAT_LABEL[k]}</option>`).join('')}</select></div>
    <div class="fgrid" data-cards></div>`;
  const cards = $('[data-cards]', root);
  const whyHTML = t => { const l = SIM.last[t]; if (!l) return '<span class="faint">No moves yet.</span>';
    const d = DREAM[l.dream];
    return `${dlHTML(l)} — ${esc(l.reason)} <a href="/session/${l.b + 1}#t${l.turn}">${d ? esc(d.scenario) : ''} · <time data-t="${l.t}">${ago(l.t)}</time></a>`; };
  const sk = () => sortBy === 'ticker' ? 'confidence' : sortBy;
  function draw(){
    const list = STOCKS.filter(s => kind === 'all' || s.kind === kind)
      .sort((a, b) => sortBy === 'ticker' ? a.ticker.localeCompare(b.ticker) : SIM.vals[b.ticker][sortBy] - SIM.vals[a.ticker][sortBy]);
    cards.innerHTML = list.map(s => `<article class="panel fc" data-t="${esc(s.ticker)}">
      <div class="hd">${logo(s.ticker, 44)}<div class="nm"><a class="t" href="/stock/${encodeURIComponent(s.ticker)}">$${esc(s.ticker)}</a><div class="ep">${esc(s.epithet)}</div></div><span class="kind">${s.kind}</span></div>
      ${statsHTML(s.ticker, true)}
      <div class="ft"><span data-sw>${stateHTML(s.ticker)}</span><span data-sp title="${STAT_LABEL[sk()]}, last 60 sessions">${spark(s.ticker, sk())}</span></div>
      <div class="why" data-why>${whyHTML(s.ticker)}</div></article>`).join('') || '<p class="muted">None of that kind.</p>';
  }
  $$('[data-kind]', root).forEach(b => b.onclick = () => { kind = b.dataset.kind; store.set('sr-fkind2', kind); $$('[data-kind]', root).forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  $('#fsort', root).onchange = e => { sortBy = e.target.value; store.set('sr-fsort2', sortBy); draw(); };
  draw();
  let histN = SIM.broadcastIndex, n = 0;
  return { tick(fresh){
    const newB = SIM.broadcastIndex !== histN; histN = SIM.broadcastIndex;
    for (const c of $$('.fc', cards)){
      const t = c.dataset.t, hit = fresh.some(e => e.ticker === t);
      if (!hit && !newB) continue;
      updateStats(c, t, fresh);
      c.querySelector('[data-sw]').innerHTML = stateHTML(t);
      c.querySelector('[data-why]').innerHTML = whyHTML(t);
      if (newB) c.querySelector('[data-sp]').innerHTML = spark(t, sk());
      if (hit){ c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1400); }
    }
    if (++n % 15 === 0) refreshTimes(cards);
  }};
}

/* archive totals: every finished broadcast since the rooms opened */
function archiveTotals(){
  const cur = E.locate(Date.now()), perCycle = DREAMS.reduce((s, d) => s + (DREAM[d.id].timeline || []).length, 0);
  let events = cur.cycle * perCycle;
  const { p } = E.perm(cur.cycle);
  for (let k = 0; k < cur.index % E.N; k++) events += E.list[p[k]].timeline.length;
  return { sessions: cur.index, hours: (cur.start - E.EPOCH) / 3600e3, events };
}

function chartSVG(t, k){
  const a = SIM.histOf(t, k), base = STOCK[t].stats[k], w = 300, h = 64;
  const y = v => (h - 3 - v / 100 * (h - 6)).toFixed(1);
  const pts = a.map((v, i) => `${(i / Math.max(1, a.length - 1) * w).toFixed(1)},${y(v)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${STAT_LABEL[k]} history">
    <line x1="0" x2="${w}" y1="${y(base)}" y2="${y(base)}" stroke="var(--faint)" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>
    ${a.length > 1 ? `<polyline points="0,${h} ${pts} ${w},${h}" fill="rgba(244,244,242,.04)" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="rgba(244,244,242,.8)" stroke-width="1.3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>` : ''}</svg>`;
}
