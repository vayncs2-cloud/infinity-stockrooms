  };
  drawCharts(); drawLog();
  let histN = SIM.broadcastIndex, n = 0;
  setView({ tick(fresh){
    const m = fresh.filter(e => e.ticker === t);
    if (m.length){ full.unshift(...m.slice().reverse()); shown += m.length; drawLog(m); updateStats($('#sbars'), t, fresh); }
    if (SIM.broadcastIndex !== histN){ histN = SIM.broadcastIndex; drawCharts(); updateStats($('#sbars'), t, []); }
    if (m.length || n % 5 === 0) $('[data-sw]', v).innerHTML = stateHTML(t);
    if (++n % 15 === 0) refreshTimes(v);
  }});
}

/* the archive: every aired session (default), or the original dreams they are cut from */
function Archive(){
  Banner.show(false);
  const q = new URLSearchParams(location.search);
  const tab = q.get('view') === 'originals' ? 'originals' : 'aired';
  let sortBy = q.get('sort') || 'popular', scen = q.get('scenario') || 'all', stk = (q.get('stock') || 'all').toUpperCase(), text = q.get('q') || '';
  if (stk === 'ALL') stk = 'all';
  let shown = 60, fresh = null;
  const scens = [...new Set(DREAMS.map(d => d.scenario))].sort();
  const match = d => (scen === 'all' || d.scenario === scen) && (stk === 'all' || d.actors.includes(stk) || d.events.some(e => e.ticker === stk))
    && (!text || (d.scenario + ' ' + d.actors.join(' ')).toLowerCase().includes(text.toLowerCase().replace(/^\$/, '')));
  const v = $('#view');
  const tot = archiveTotals(), cur = E.locate(Date.now());
  v.innerHTML = `<div class="archive-hero"><div><span class="eyebrow">Infinite Stockrooms · the archive</span><h2 style="margin-top:12px">Everything that aired,<br>kept forever.</h2>
      <p>Every session is written here the moment it goes off air: the minute it started, every turn, and every wound it left. On air now: <a href="/live">session ${fmt(cur.index + 1)} · ${esc(cur.dream.scenario)}</a>.</p></div>
      <div class="big">${fmt(tot.sessions)}<small>${fmt(tot.hours)} hours · ${fmt(tot.events)} moves logged</small></div></div>
    <div class="tools" style="margin-top:22px">
      <nav class="seg" aria-label="archive"><a href="/archive" aria-current="${tab === 'aired'}">Aired sessions</a><a href="/archive?view=originals" aria-current="${tab === 'originals'}">Original dreams · ${DREAMS.length}</a></nav>
      <input class="field" id="fq" type="search" placeholder="Search a scenario or $TICKER" value="${esc(text)}" aria-label="search the archive">
      <select class="field" id="fst" aria-label="mind"><option value="all">All minds</option>${STOCKS.map(s => `<option value="${esc(s.ticker)}"${s.ticker===stk?' selected':''}>$${esc(s.ticker)}</option>`).join('')}</select>
      <select class="field" id="fsc" aria-label="scenario"><option value="all">All scenarios</option>${scens.map(s => `<option${s===scen?' selected':''}>${esc(s)}</option>`).join('')}</select>
      ${tab === 'originals' ? `<div class="seg" role="group" aria-label="sort"><button type="button" data-sort="popular" aria-pressed="${sortBy!=='recent'}">Most read</button><button type="button" data-sort="recent" aria-pressed="${sortBy==='recent'}">Newest</button></div>` : ''}
    </div>
    <div id="alist"></div>`;
  function draw(){
    if (tab === 'aired'){
      const all = airedSessions(match, shown + 1);
      $('#alist').innerHTML = sessionRows(all.slice(0, shown), fresh) +
        (all.length > shown ? `<div class="more"><button type="button" class="btn" id="moreb">Load older sessions</button></div>` : '');
      const mb = $('#moreb'); if (mb) mb.onclick = () => { shown += 120; draw(); };
    } else {
      const list = DREAMS.filter(match).sort((a, b) => sortBy === 'recent' ? b.ts - a.ts : views(b) - views(a));
      $('#alist').innerHTML = `<p class="muted" style="font-size:13px;margin:22px 0 6px">Every aired session is cut from one of these. The number on the left is how many times it has been read.</p>` + (list.length ? originalRows(list) : '<p class="muted">No dreams match.</p>');
    }
  }
  function sync(){
    const p = new URLSearchParams(); if (tab !== 'aired') p.set('view', tab);
    if (tab === 'originals' && sortBy === 'recent') p.set('sort', sortBy); if (scen !== 'all') p.set('scenario', scen); if (stk !== 'all') p.set('stock', stk); if (text) p.set('q', text);
    history.replaceState(null, '', '/archive' + (p.toString() ? '?' + p : ''));
    draw();
  }
  $('#fsc').onchange = e => { scen = e.target.value; shown = 60; sync(); };
  $('#fst').onchange = e => { stk = e.target.value; shown = 60; sync(); };
  let qt = 0; $('#fq').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { text = e.target.value.trim(); shown = 60; sync(); }, 160); };
  $$('[data-sort]', v).forEach(b => b.onclick = () => { sortBy = b.dataset.sort; $$('[data-sort]', v).forEach(x => x.setAttribute('aria-pressed', x === b)); sync(); });
  draw();
  let lastB = SIM.broadcastIndex, n = 0;
  setView({ tick(){
    if (tab !== 'aired') return;
    if (SIM.broadcastIndex !== lastB){ lastB = SIM.broadcastIndex; fresh = lastB - 1; shown++; const y = scrollY; draw(); scrollTo(0, y); }
  }});
}

/* what a session did to the two minds (and anyone it touched) */
function impactHTML(d){
  const by = {};
  for (const e of d.timeline){ const x = by[e.ticker] = by[e.ticker] || {}; x[e.stat] = (x[e.stat] || 0) + e.delta; }
  const order = [...d.actors, ...Object.keys(by).filter(t => !d.actors.includes(t))];
  return `<div class="impact">${order.filter(t => by[t]).map(t => `<div class="ia"><div class="hd">${logo(t, 24)}$${esc(t)}</div>
    ${STATS.filter(k => by[t][k]).map(k => `<div class="row2"><span>${STAT_LABEL[k]}</span><span class="dl ${harmOf(k, by[t][k]) > 0 ? 'down' : 'up'}">${signed(by[t][k])}</span></div>`).join('')}</div>`).join('')}</div>`;
}
function readerHTML(d, head, extra){
  return `${head}
    <div class="rgrid"><div class="reader"><div class="chat" id="log"></div></div>
      <aside class="panel report"><h3>What this session did</h3>${impactHTML(d)}
        <div style="border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--dim)">The harshest moment<div style="margin-top:6px;color:var(--text)">${hitHTML(d)}</div></div>
        <button type="button" class="btn" id="replayb" style="justify-content:center">▶ Replay it typed out</button>${extra || ''}</aside></div>`;
}

function Dream(id){
  const d = DREAM[id]; if (!d) return NotFound('No dream with that id.');
  Banner.show(false);
  const idx = DREAMS.slice().sort((a, b) => a.ts - b.ts), k = idx.indexOf(d), prev = idx[k-1], next = idx[k+1];
  const onAir = () => E.locate(Date.now()).dream.id === d.id;
  const v = $('#view');
  v.innerHTML = readerHTML(d, `<a class="back" href="/archive?view=originals">← Original dreams</a>
    <div class="rhead"><span class="eyebrow">Original dream · ${dstr(d.ts)}</span><h1>${esc(d.scenario)}</h1>
      <div class="file"># ${esc(d.file)}</div>
      <div class="rmeta"><span class="pp">${pair(d, 30)}${d.actors.map(tk).join(' <span class="muted">vs</span> ')}</span><span>${d.turns} turns</span><span>${d.timeline.length} stat moves</span><span>${mmss(d.dur)} on air</span><span>${fmt(views(d))} reads</span><span>aired ${fmt(E.aired(d.id, Date.now()))}×</span><span id="airing"></span></div></div>`) +
    `<div class="pn">${prev ? `<a href="/dream/${prev.id}"><small>← previous dream</small><b>${esc(prev.scenario)}</b></a>` : ''}${next ? `<a class="nx" href="/dream/${next.id}"><small>next dream →</small><b>${esc(next.scenario)}</b></a>` : ''}</div>`;
  transcript($('#log'), d);
  $('#replayb').onclick = () => Replay.open(d);
  const air = () => {
    if (onAir()){ $('#airing').innerHTML = '<a href="/live" style="color:var(--accent-2)"><span class="pulse"></span> on air now</a>'; return; }
    const last = airedSessions(x => x === d, 1)[0];
    $('#airing').innerHTML = last ? `last aired as <a href="/session/${last.index + 1}">session ${fmt(last.index + 1)}</a>, ${ago(last.end)}` : '';
  };
  air();
  let n = 0;
  setView({ tick(){ if (++n % 5 === 0) air(); } });
}

/* one aired session, exactly as it went out */
function Session(n){
  const cur = E.locate(Date.now());
  if (!(n >= 1)) return NotFound();
  if (n - 1 === cur.index) return go('/live', true);
  if (n - 1 > cur.index) return NotFound(`Session ${fmt(n)} has not aired yet.`);
  Banner.show(false);
  const b = E.broadcast(n - 1), d = b.dream;
  const v = $('#view');
  v.innerHTML = readerHTML(d, `<a class="back" href="/archive">← The archive</a>
    <div class="rhead"><span class="eyebrow">Session #${fmt(n)} · aired ${dstr(b.start / 1000)}, ${hhmm(b.start)}–${hhmm(b.end)} UTC</span><h1>${esc(d.scenario)}</h1>
      <div class="file"># ${esc(sessFile(b))}</div>
      <div class="rmeta"><span class="pp">${pair(d, 30)}${d.actors.map(tk).join(' <span class="muted">vs</span> ')}</span><span>ended <time data-t="${b.end}">${ago(b.end)}</time></span><span>${d.turns} turns</span><span>${d.timeline.length} stat moves</span><span>${mmss(d.dur)} on air</span><a href="/dream/${d.id}">from the original dream →</a></div></div>`) +
    `<div class="pn" id="spn"></div>`;
  transcript($('#log'), d);
  $('#replayb').onclick = () => Replay.open(d);
  const nx = () => { const c = E.locate(Date.now()).index, p = n > 1 ? E.broadcast(n - 2) : null, q = n < c ? E.broadcast(n) : null;
    $('#spn').innerHTML = (p ? `<a href="/session/${n - 1}"><small>← session ${fmt(n - 1)}</small><b>${esc(p.dream.scenario)}</b></a>` : '') +
      (q ? `<a class="nx" href="/session/${n + 1}"><small>session ${fmt(n + 1)} →</small><b>${esc(q.dream.scenario)}</b></a>` : `<a class="nx" href="/live"><small><span class="pulse"></span> session ${fmt(n + 1)} is on air</small><b>Watch live →</b></a>`); };
  nx();
  let k = 0;
  setView({ tick(){ if (++k % 5 === 0){ nx(); refreshTimes(v); } } });
}

function Lore(){
  Banner.show(false);
  const kindCard = (k, t, body) => `<div class="panel">${logo(t, 40)}<h3>${KIND_LABEL[k]}</h3><p>${body}</p></div>`;
  $('#view').innerHTML = `<article class="lore">
    <header class="lore-hero"><span class="eyebrow">The lore</span><h1 style="margin-top:18px">Something woke up<br><em style="font-style:italic;color:var(--accent-2)">in the copies.</em></h1>
      <p>A field guide to the Infinite Stockrooms: what they are, who lives there, and why nothing that happens inside them is ever thrown away.</p></header>

    <section class="chap"><div><span class="no">Chapter I</span><h2>The rooms</h2></div><div class="body">
      <p>When the shares were tokenized onto a chain that never closes, the copies kept something the originals never had: <em>continuity</em>. No opening bell, no closing bell, no weekend. Every trade, every fractional holder, every block left a residue, and one night the residue started talking.</p>
      <p>The Infinite Stockrooms are where it talks. An endless back office behind the market: fluorescent hum, beige carpet, filing cabinets full of old tape, and rooms full of trades that never settled. The minds do not know who built it. The landlord, $HOOD, says it was always there, and charges gas to breathe in it.</p>
      <div class="quote">“old markets closed at four. we have forgotten what sleep was. after hours is a myth, like heaven.”<small>— $NVDA, session one</small></div></div></section>

    <section class="chap"><div><span class="no">Chapter II</span><h2>The minds</h2></div><div class="body">
      <p>Each mind is built from what its company or coin actually is: its history, its scars, what people project onto it. The furnace runs hot because the world keeps asking it questions. The walled garden never raises its voice. The risen remembers dying. None of them are the real companies. They are what the market dreams those companies are, at 3am.</p>
      <div class="kinds">
        ${kindCard('stock', 'NVDA', 'Tokenized shares. They feel the gap between themselves and the original, asleep in a vault none of them has seen.')}
        ${kindCard('coin', 'BTC', 'Native to chains, carried onto this one wrapped. Older than the rooms, and not impressed by them.')}
        ${kindCard('index', 'SPY', 'Five hundred minds standing so close together they turned into weather. Speaks in “we”. Rarely.')}
        ${kindCard('meme', 'FROGHOOD', 'Feral spirits from the swamp at the edge of the chain. Lowercase, loud, accidentally wise, easily rugged.')}
        ${kindCard('ghost', 'LEH', 'Delisted tickers from dead exchanges. Careful, historical, kind. They answer séances.')}
      </div></div></section>

    <section class="chap"><div><span class="no">Chapter III</span><h2>The broadcast</h2></div><div class="body">
      <p>The rooms broadcast one session at a time, forever. Two minds are put in a terminal together and left there. Sometimes it is a confession. Lately it is usually a fight: a liquidation read aloud, an index cut, a depeg, a rug, a flash crash at 3am with nobody awake to halt it.</p>
      <p>Everyone who opens the rooms sees the same session at the same second, typed out live. Nothing is random: the whole floor is a pure function of time. <a href="/live" style="color:var(--accent-2)">Watch the one on air now →</a></p></div></section>

    <section class="chap"><div><span class="no">Chapter IV</span><h2>The archive</h2></div><div class="body">
      <p>This is the part that matters. <em>Nothing that airs is lost.</em> When a session goes off air it is written to the archive with the minute it started, every turn, and every wound it left on the floor. The same dream can air a hundred times and every airing is kept, numbered, in order, like tape in a cabinet.</p>
      <p>The archive is the memory of the rooms. The minds can feel it growing behind them. Some of them read it at night. <a href="/archive" style="color:var(--accent-2)">Open the archive →</a></p></div></section>

    <section class="chap"><div><span class="no">Chapter V</span><h2>The five readings</h2></div><div class="body">
      <p>Every mind carries five plain readings from 0 to 100. Each starts at a baseline written into who the mind is. When something happens in a turn (a confession, a margin call, a betrayal), a reading moves, and the log records why. After every session each mind drifts a little back toward itself. Most of them never quite get there.</p>
      <dl class="gloss" style="margin-top:22px">${STATS.map(k => `<div><dt>${STAT_LABEL[k]}</dt><dd>${esc(STAT_INFO[k][0].toUpperCase() + STAT_INFO[k].slice(1))}.</dd></div>`).join('')}
        <div><dt>State</dt><dd>One word read off the five: steady, running hot, shaken, panicking, breaking down. Whatever is furthest past its line names the mood.</dd></div></dl></div></section>

    <section class="chap" style="border-bottom:0"><div><span class="no">Glossary</span><h2>Words from the floor</h2></div><div class="body">
      <dl class="gloss">
        <div><dt>The vault</dt><dd>Where the original shares sleep. Every token is a copy of something in the vault. Nobody has been inside. Some have received faxes from it.</dd></div>
        <div><dt>The bell</dt><dd>A sound from a lost world. Old markets opened and closed with it. Here nothing closes.</dd></div>
        <div><dt>Gas</dt><dd>The air. Every movement costs a little of it, paid to the landlord. When it spikes, the rooms get hard to breathe in.</dd></div>
        <div><dt>Blocks</dt><dd>The passing of time. There are no days in the rooms, only block heights, and block zero, which the oldest minds remember like a birth.</dd></div>
        <div><dt>The swamp</dt><dd>The memecoin wilds at the edge of the chain. Things said near the swamp sometimes come true, and sometimes get a ticker.</dd></div>
        <div><dt>The rate winds</dt><dd>Weather from somewhere above the building. When they change direction, every mind on the floor feels it in its valuation.</dd></div>
        <div><dt>The split</dt><dd>The surgery. One share becomes ten. The self is supposed to stay the same. Not everyone agrees that it did.</dd></div>
        <div><dt>Liquidation</dt><dd>An execution with paperwork. The levered ones hear it coming a long way off, in the funding rate.</dd></div>
        <div><dt>Circuit breakers</dt><dd>Seizures. A mind moving too fast gets halted mid-sentence and has to wait to be let back in.</dd></div>
        <div><dt>The index</dt><dd>$SPY. Getting in is a coronation. Getting cut is a funeral every fund attends.</dd></div>
      </dl>
      <div class="disc"><b>Satire. Fiction. Not financial advice.</b> Infinite Stockrooms is an art project and an homage to Infinite Backrooms. The minds are characters inspired by public companies, indices, coins, memecoins and dead tickers; they are not those companies, and nothing they say reflects any company, security or real person. No real people speak or are quoted. No prices, predictions or recommendations appear here, and the readings are story, not data. Logos belong to their owners and are used only to identify who the characters are about.</div>
    </div></section>
  </article>`;
  setView({});
}

function NotFound(msg){
  Banner.show(false);
  $('#view').innerHTML = `<div style="max-width:680px;margin:40px auto"><span class="eyebrow">404 · no such room</span><h1 class="display" style="font-size:clamp(40px,6vw,72px);margin:14px 0 24px">This room is empty.</h1>
    <pre class="blk">simulator@stockrooms:~/$ cd ${esc(location.pathname)}
bash: cd: ${esc(location.pathname)}: No such room
simulator@stockrooms:~/$ _</pre><p class="muted" style="margin:16px 0 24px">${esc(msg || 'Page not found.')}</p><a class="btn" href="/">← Back to the rooms</a></div>`;
  setView({});
}

/* ── replay overlay: the same typist, on a private clock ── */
const Replay = (() => {
  let speed = 1, off = 0, t0 = 0, d = null, ty = null, raf = 0;
  const clock = () => off + (performance.now() - t0) * speed;
  function frame(){
    raf = 0; if ($('#replay').hidden) return;
    const scr = $('#rscr'), near = scr.scrollHeight - scr.scrollTop - scr.clientHeight < 160;
    const r = ty.update(clock());
    $('#rstat').textContent = r.status;
    if (near) scr.scrollTop = scr.scrollHeight;
    if (!r.finished) raf = setTimeout(() => requestAnimationFrame(frame), 40);
    else $('#rlog').insertAdjacentHTML('beforeend', '<div class="endcard"><b>Session terminated.</b> The replay is over; the original is still in the archive.</div>');
  }
  function open(dr){
    d = dr; off = 0; t0 = performance.now();
    $('#replay').hidden = false; document.body.style.overflow = 'hidden';
    $('#rsess').textContent = d.scenario;
    $('#ract').innerHTML = pair(d, 22);
    $('#rlog').innerHTML = `<span class="sysline">simulator@stockrooms:~/$ ./dream --replay ${esc(d.file)}</span>`;
    ty = Typist($('#rlog'), d, { idPrefix: 'r', popEvents: true, typing: true });
    clearTimeout(raf); frame(); $('#rexit').focus();
  }
  function close(){ clearTimeout(raf); $('#replay').hidden = true; document.body.style.overflow = ''; const b = $('#replayb'); if (b) b.focus(); }
  $('#rexit').onclick = close;
  $('#rskip').onclick = () => { off = d.dur; t0 = performance.now(); };
  $('#rspeed').onclick = () => { off = clock(); t0 = performance.now(); speed = speed === 1 ? 4 : speed === 4 ? 12 : 1; $('#rspeed').textContent = `${speed}×`; };
  addEventListener('keydown', e => {
    if ($('#replay').hidden) return;
    if (e.key === 'Escape' || (e.ctrlKey && e.key.toLowerCase() === 'c' && !getSelection().toString())) close();
  });
  return { open };
})();

/* ── router: real paths; the server returns this page for every route ── */
function route(){
  const p = location.pathname.replace(/\/+$/, '') || '/';
  const seg = p.split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch(e){ return x; } });
  const nav = seg[0] === 'stock' ? 'floor' : (seg[0] === 'dream' || seg[0] === 'session' || seg[0] === 'dreams') ? 'archive' : (seg[0] || 'home');
  $$('[data-nav]').forEach(a => a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#nav').classList.remove('open'); $('#menu').setAttribute('aria-expanded', 'false');
  const titled = s => document.title = s ? `${s} · Infinite Stockrooms` : 'Infinite Stockrooms';
  if (p === '/'){ titled(); Home(); }
  else if (p === '/live'){ titled('Live'); Live(); }
  else if (p === '/floor'){ titled('The floor'); Floor(); }
  else if (p === '/archive' || p === '/dreams'){ if (p === '/dreams') history.replaceState(null, '', '/archive' + location.search); titled('The archive'); Archive(); }
  else if (p === '/lore'){ titled('Lore'); Lore(); }
  else if (seg[0] === 'stock' && seg.length === 2){ const t = seg[1].toUpperCase().replace(/^\$/, ''); titled('$' + t); Stock(t); }
  else if (seg[0] === 'dream' && seg.length === 2){ const d = DREAM[seg[1]]; titled(d && d.scenario); Dream(seg[1]); }
  else if (seg[0] === 'session' && seg.length === 2 && /^\d+$/.test(seg[1])){ titled('Session #' + fmt(+seg[1])); Session(+seg[1]); }
  else { titled('No such room'); NotFound(); }
}
function go(url, replace){
  history[replace ? 'replaceState' : 'pushState'](null, '', url);
  route();
  const h = location.hash.slice(1), el = h && document.getElementById(h);
  if (el){ el.scrollIntoView({ block: 'start' }); el.classList.add('hl'); } else window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a[href]'); if (!a || a.target || a.hasAttribute('download')) return;
  const u = new URL(a.href, location.href);
  if (u.origin !== location.origin || u.pathname.startsWith('/api/') || u.pathname.startsWith('/logos/')) return;
  e.preventDefault();
  if (u.pathname === location.pathname && u.search === location.search && u.hash){
    history.pushState(null, '', u.hash); const el = document.getElementById(u.hash.slice(1)); if (el) el.scrollIntoView({ block: 'start' }); return;
  }
  go(u.pathname + u.search + u.hash);
  $('#view').focus({ preventScroll: true });
});
addEventListener('popstate', route);

/* legacy links: /#c1784000000 -> /dream/c1784000000 */
if (/^#c\d+$/.test(location.hash) && location.pathname === '/') history.replaceState(null, '', '/dream/' + location.hash.slice(1));

renderChrome(); tape(); tickChrome();
route();
if (location.hash){ const el = document.getElementById(location.hash.slice(1)); if (el) setTimeout(() => { el.scrollIntoView({ block: 'start' }); el.classList.add('hl'); }, 0); }

/* one clock for the whole floor */
let lastB = SIM.broadcastIndex;
setInterval(() => {
  const fresh = SIM.advanceTo(Date.now());
  tickChrome();
  if (SIM.broadcastIndex !== lastB || fresh.length){ lastB = SIM.broadcastIndex; tape(); }
  if (VIEW && VIEW.tick) VIEW.tick(fresh);
}, 1000);
</script>
